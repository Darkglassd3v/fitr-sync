name: FITR Daily Sync

on:
  schedule:
    - cron: '1 0 * * *'
  workflow_dispatch:

# Permessi per committare board_data.json aggiornato
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: fitr
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Esegui sync
        env:
          FITR_SRC_EMAIL: ${{ secrets.FITR_SRC_EMAIL }}
          FITR_SRC_PASS:  ${{ secrets.FITR_SRC_PASS }}
          FITR_DST_EMAIL: ${{ secrets.FITR_DST_EMAIL }}
          FITR_DST_PASS:  ${{ secrets.FITR_DST_PASS }}
        run: python fitr_sync.py

      - name: Esporta board del giorno
        env:
          FITR_DST_EMAIL: ${{ secrets.FITR_DST_EMAIL }}
          FITR_DST_PASS:  ${{ secrets.FITR_DST_PASS }}
        run: python board_export.py

      - name: Commit board aggiornata
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add docs/board_data.json
          git commit -m "Aggiorna board $(date +%F)" || echo "Nessuna modifica alla board"
          git push

      - name: Salva log come artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-log-${{ github.run_id }}
          path: fitr_sync_log/
          retention-days: 30
