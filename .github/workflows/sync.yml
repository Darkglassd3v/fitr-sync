name: FITR Daily Sync

on:
  schedule:
    # Ogni giorno alle 00:01 UTC (02:01 ora italiana)
    - cron: '1 0 * * *'
  # Permette di lanciarlo manualmente dal tab Actions su GitHub
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze
        run: pip install requests

      - name: Esegui sync
        env:
          FITR_SRC_EMAIL: ${{ secrets.FITR_SRC_EMAIL }}
          FITR_SRC_PASS:  ${{ secrets.FITR_SRC_PASS }}
          FITR_DST_EMAIL: ${{ secrets.FITR_DST_EMAIL }}
          FITR_DST_PASS:  ${{ secrets.FITR_DST_PASS }}
        run: python fitr_sync.py

      - name: Salva log come artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-log-${{ github.run_id }}
          path: fitr_sync_log/
          retention-days: 30
