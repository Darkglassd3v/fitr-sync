<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0a0b; --panel:#141416; --panel-hi:#1b1b1f; --line:#26262b;
    --ink:#f4f4f2; --ink-dim:#8a8a92; --signal:#ff5b1e; --signal-dim:#7a2e12;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    background:var(--bg); color:var(--ink);
    font-family:'Barlow',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100%;
  }

  /* ── Gate password ─────────────────────────────────────── */
  #gate {
    position:fixed; inset:0; z-index:100;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg); padding:1.5rem;
  }
  #gate.hidden { display:none; }
  .gate-box { width:100%; max-width:340px; text-align:center; }
  .gate-brand {
    font-family:'Barlow Condensed',sans-serif; font-weight:800;
    font-size:clamp(1.8rem,6vw,2.6rem); letter-spacing:0.04em;
    text-transform:uppercase; line-height:1; margin-bottom:1.8rem;
  }
  .gate-brand span { color:var(--signal); }
  .gate-input {
    width:100%; background:var(--panel); border:1px solid var(--line);
    border-radius:4px; padding:0.8em 1em; color:var(--ink);
    font-family:'Barlow',sans-serif; font-size:1rem; text-align:center;
    letter-spacing:0.1em; margin-bottom:0.8rem;
  }
  .gate-input:focus { outline:none; border-color:var(--signal); }
  .gate-btn {
    width:100%; background:var(--signal); border:none; border-radius:4px;
    padding:0.8em; color:#0a0a0b; cursor:pointer;
    font-family:'Barlow Semi Condensed',sans-serif; font-weight:600;
    font-size:0.95rem; letter-spacing:0.1em; text-transform:uppercase;
  }
  .gate-err {
    color:var(--signal); font-family:'Barlow Semi Condensed',sans-serif;
    font-size:0.85rem; letter-spacing:0.08em; text-transform:uppercase;
    margin-top:0.8rem; min-height:1.2em;
  }
  .gate-note {
    display:none; margin-top:1.4rem; padding:0.7rem 0.9rem;
    border:1px solid var(--line); border-left:3px solid var(--signal);
    border-radius:4px; background:var(--panel);
    font-family:'Barlow',sans-serif; font-size:0.82rem; line-height:1.4;
    color:var(--ink-dim); text-align:left;
  }
  .gate-note.show { display:block; }
  .gate-note strong { color:var(--signal); font-weight:600; }

  .board { display:none; flex-direction:column; min-height:100vh;
    padding:clamp(0.8rem,2vw,2.5rem); gap:clamp(0.6rem,1.4vw,1.2rem); }
  .board.show { display:flex; }

  header {
    display:flex; align-items:baseline; justify-content:space-between;
    flex-wrap:wrap; gap:0.5rem 1rem;
    padding-bottom:clamp(0.4rem,1vw,0.8rem);
    flex-shrink:0;
  }
  .brand { font-family:'Barlow Condensed',sans-serif; font-weight:800;
    font-size:clamp(1.3rem,3vw,2.4rem); letter-spacing:0.04em;
    text-transform:uppercase; line-height:1; }
  .brand span { color:var(--signal); }
  .clock { font-family:'Barlow Condensed',sans-serif; font-weight:700;
    font-size:clamp(1rem,2.6vw,2rem); color:var(--signal);
    letter-spacing:0.04em; font-variant-numeric:tabular-nums; }

  /* ── Strip settimana ───────────────────────────────────── */
  .week {
    display:grid; grid-template-columns:repeat(7,1fr);
    gap:clamp(0.25rem,0.7vw,0.6rem);
    border-bottom:3px solid var(--signal);
    padding-bottom:clamp(0.5rem,1.2vw,1rem);
    flex-shrink:0;
  }
  .daybtn {
    background:var(--panel); border:1px solid var(--line);
    border-radius:4px; padding:clamp(0.4rem,1vw,0.8rem) 0.2rem;
    cursor:pointer; text-align:center;
    -webkit-tap-highlight-color:transparent;
    transition:background 0.15s ease, border-color 0.15s ease;
  }
  .daybtn:hover { background:var(--panel-hi); }
  .daybtn .wd {
    font-family:'Barlow Semi Condensed',sans-serif; font-weight:600;
    font-size:clamp(0.6rem,1.1vw,0.9rem); letter-spacing:0.08em;
    color:var(--ink-dim); display:block;
  }
  .daybtn .dn {
    font-family:'Barlow Condensed',sans-serif; font-weight:700;
    font-size:clamp(1.1rem,2.4vw,1.9rem); line-height:1.1; display:block;
  }
  .daybtn .dot {
    width:5px; height:5px; border-radius:50%; background:var(--signal);
    margin:0.25rem auto 0; opacity:0;
  }
  .daybtn.has-content .dot { opacity:1; }
  .daybtn.today { border-color:var(--signal-dim); }
  .daybtn.today .dn { color:var(--signal); }
  .daybtn.active {
    background:var(--signal); border-color:var(--signal);
  }
  .daybtn.active .wd,
  .daybtn.active .dn { color:#0a0a0b; }
  .daybtn.active .dot { background:#0a0a0b; }
  /* Cursore telecomando sui giorni */
  .daybtn.focused {
    box-shadow:0 0 0 2px var(--signal);
    border-color:var(--signal);
  }

  .daylabel {
    font-family:'Barlow Condensed',sans-serif; font-weight:600;
    font-size:clamp(0.95rem,2.2vw,1.7rem); letter-spacing:0.06em;
    text-transform:uppercase; color:var(--ink-dim); flex-shrink:0;
  }

  .sections { flex:1; display:grid; gap:clamp(0.6rem,1.4vw,1.2rem);
    align-content:start; grid-template-columns:1fr; }
  @media (orientation:landscape) and (min-width:900px) {
    .sections { grid-template-columns:repeat(2,1fr); }
  }
  @media (orientation:landscape) and (min-width:1700px) {
    .sections[data-many="true"] { grid-template-columns:repeat(3,1fr); }
  }

  .section { background:var(--panel); border:1px solid var(--line);
    border-left:4px solid var(--signal); border-radius:4px;
    overflow:hidden; align-self:start; }
  .section-head { display:flex; align-items:center; justify-content:space-between;
    gap:0.75rem; padding:clamp(0.6rem,1.4vw,1.1rem);
    user-select:none; -webkit-tap-highlight-color:transparent; }
  .section-title { font-family:'Barlow Condensed',sans-serif; font-weight:700;
    font-size:clamp(1rem,2vw,1.8rem); letter-spacing:0.03em;
    text-transform:uppercase; color:var(--signal); line-height:1.05; flex:1; }
  .chevron { flex-shrink:0; width:clamp(0.9rem,1.5vw,1.3rem);
    height:clamp(0.9rem,1.5vw,1.3rem);
    border-right:3px solid var(--ink-dim); border-bottom:3px solid var(--ink-dim);
    transform:rotate(45deg); transition:transform 0.2s ease;
    margin-right:0.3rem; margin-top:-0.3em; }
  .section.open .chevron { transform:rotate(-135deg); margin-top:0.2em; }
  .section-content { max-height:0; overflow:hidden; transition:max-height 0.25s ease; }
  .section.open .section-content { max-height:8000px; }
  .section-body { font-family:'Barlow',sans-serif; font-weight:500;
    font-size:clamp(0.9rem,1.5vw,1.4rem); line-height:1.4; white-space:pre-wrap;
    padding:0 clamp(0.6rem,1.4vw,1.1rem) clamp(0.6rem,1.4vw,1.1rem); }
  .section-preview { font-family:'Barlow',sans-serif; font-weight:500;
    font-size:clamp(0.85rem,1.4vw,1.3rem); line-height:1.4; color:var(--ink-dim);
    padding:0 clamp(0.6rem,1.4vw,1.1rem) clamp(0.6rem,1.4vw,1.1rem);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; white-space:pre-wrap; }
  .section.open .section-preview { display:none; }
  .section-media { display:flex; flex-wrap:wrap; gap:0.4rem;
    padding:0 clamp(0.6rem,1.4vw,1.1rem) clamp(0.6rem,1.4vw,1.1rem); }
  .media-tag { font-family:'Barlow Semi Condensed',sans-serif;
    font-size:clamp(0.65rem,1vw,0.85rem); letter-spacing:0.05em;
    text-transform:uppercase; color:var(--signal);
    border:1px solid var(--signal-dim); border-radius:3px; padding:0.15em 0.5em; }

  /* Blocco selezionato con telecomando/tastiera */
  .section-head:focus { outline:none; }
  .section.focused {
    border-color:var(--signal);
    box-shadow:0 0 0 2px var(--signal);
  }
  .section-head { cursor:pointer; }

  /* ── Vista settimana intera (TV) ────────────────────────── */
  .weekgrid {
    flex:1; display:grid; grid-template-columns:repeat(7,1fr);
    gap:clamp(0.3rem,0.6vw,0.7rem); align-items:stretch;
    min-height:0; overflow:hidden;
  }
  .wcol {
    background:var(--panel); border:1px solid var(--line);
    border-radius:4px; display:flex; flex-direction:column;
    overflow:hidden; min-height:0;
  }
  .wcol.today { border-color:var(--signal); }
  .wcol-head {
    background:var(--line); padding:0.35rem 0.2rem; text-align:center;
    flex-shrink:0;
  }
  .wcol.today .wcol-head { background:var(--signal); }
  .wcol-wd {
    display:block; font-family:'Barlow Semi Condensed',sans-serif;
    font-weight:600; font-size:clamp(0.55rem,0.85vw,0.8rem);
    letter-spacing:0.1em; color:var(--ink-dim);
  }
  .wcol.today .wcol-wd { color:#0a0a0b; }
  .wcol-dn {
    display:block; font-family:'Barlow Condensed',sans-serif;
    font-weight:700; font-size:clamp(0.9rem,1.6vw,1.4rem); line-height:1.1;
  }
  .wcol.today .wcol-dn { color:#0a0a0b; }
  .wcol-body { flex:1; overflow:hidden; padding:0.3rem; min-height:0; }
  .wsec { margin-bottom:0.45rem; }
  .wsec-title {
    font-family:'Barlow Condensed',sans-serif; font-weight:700;
    font-size:clamp(0.62rem,1vw,0.95rem); letter-spacing:0.02em;
    text-transform:uppercase; color:var(--signal); line-height:1.1;
    margin-bottom:0.1rem;
  }
  .wsec-body {
    font-family:'Barlow',sans-serif; font-weight:500;
    font-size:clamp(0.55rem,0.85vw,0.82rem); line-height:1.25;
    white-space:pre-wrap; color:var(--ink);
  }
  .wcol-rest {
    font-family:'Barlow Condensed',sans-serif; font-weight:800;
    font-size:clamp(1rem,2vw,1.8rem); color:var(--signal-dim);
    text-align:center; padding-top:1.5rem;
  }
  /* Su schermo stretto la settimana torna a scorrere in verticale */
  @media (orientation:portrait), (max-width:800px) {
    .weekgrid { grid-template-columns:1fr; overflow:visible; }
    .wcol-body { overflow:visible; }
  }

  /* Kiosk: nasconde elementi non necessari sulla TV */
  body.kiosk .clock { }

  .rest { flex:1; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:1rem; min-height:40vh; }
  .rest-mark { font-family:'Barlow Condensed',sans-serif; font-weight:800;
    font-size:clamp(3.5rem,15vw,13rem); color:var(--signal); line-height:0.85; }
  .rest-label { font-family:'Barlow Condensed',sans-serif; font-weight:600;
    font-size:clamp(1rem,3.5vw,2.5rem); letter-spacing:0.2em;
    text-transform:uppercase; color:var(--ink-dim); }

  footer { flex-shrink:0; display:flex; justify-content:space-between;
    align-items:center; flex-wrap:wrap; gap:0.5rem;
    font-family:'Barlow Semi Condensed',sans-serif;
    font-size:clamp(0.65rem,1vw,0.9rem); letter-spacing:0.1em;
    text-transform:uppercase; color:var(--ink-dim);
    border-top:1px solid var(--line); padding-top:clamp(0.4rem,0.8vw,0.8rem); }
  .stale { color:var(--signal); }
  .live-dot { display:inline-block; width:0.5em; height:0.5em; border-radius:50%;
    background:var(--signal); margin-right:0.4em; }
  @media (prefers-reduced-motion:no-preference) {
    .live-dot { animation:pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
  }
</style>
</head>
<body>

<!-- Gate password (protezione base lato client) -->
<div id="gate">
  <div class="gate-box">
    <div class="gate-brand">CROSS<span>BOARD</span></div>
    <input type="password" class="gate-input" id="pwd" placeholder="PASSWORD" autocomplete="current-password">
    <button class="gate-btn" id="enter">Entra</button>
    <div class="gate-err" id="err"></div>
    <div class="gate-note" id="note"></div>
  </div>
</div>

<div class="board" id="board">
  <header>
    <div class="brand">CROSS<span>BOARD</span></div>
    <div class="clock" id="clock">--:--</div>
  </header>

  <div class="week" id="week"></div>
  <div class="daylabel" id="daylabel">—</div>
  <div class="sections" id="sections"></div>

  <footer>
    <div><span class="live-dot"></span><span id="status">In diretta</span></div>
    <div id="updated">—</div>
  </footer>
</div>

<script>
  // ── Config ────────────────────────────────────────────────
  // La password non e' mai nel sorgente: qui c'e' solo il suo hash
  // PBKDF2. Valori riscritti ogni mese da rotate_password.py.
  const PWD_HASH   = "0041e63010bb858b01a17fc54735f37e29c2993e19ff581f77bbc93b98bf6d13";
  const PWD_SALT   = "b167351a90b65b7988ac4e821eb62ea3";
  const PWD_PERIOD = "2026-08";
  const KIOSK_HASH = "ad2729a251722009b97054de9dd1bc2474d9e1ea2e01926ddea4029f6197215d";
  const PBKDF2_ITER = 100000;

  // Parametri URL: ?kiosk=TOKEN salta il login, &view=week mostra la settimana
  const urlParams = new URLSearchParams(location.search);
  const VIEW_WEEK = urlParams.get("view") === "week";

  const DATA_URL   = "board_data.json";
  const REFRESH_MS = 5 * 60 * 1000;
  const STORE_KEY  = "cb_auth_" + PWD_PERIOD;   // il login scade col mese

  // ── Gate ──────────────────────────────────────────────────
  function hexToBytes(hex) {
    const out = new Uint8Array(hex.length / 2);
    for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
    return out;
  }
  function bytesToHex(buf) {
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
  }

  async function hashPassword(password) {
    const enc = new TextEncoder();
    const key = await crypto.subtle.importKey(
      "raw", enc.encode(password), "PBKDF2", false, ["deriveBits"]
    );
    const bits = await crypto.subtle.deriveBits(
      { name: "PBKDF2", salt: hexToBytes(PWD_SALT), iterations: PBKDF2_ITER, hash: "SHA-256" },
      key, 256
    );
    return bytesToHex(bits);
  }

  // ── Avviso cambio password ────────────────────────────────
  // La password si rinnova da sola il 1 del mese: avvisa negli ultimi giorni.
  (function checkExpiry() {
    const note = document.getElementById("note");
    const now  = new Date();

    // Giorni rimanenti nel mese corrente
    const lastDay  = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    const daysLeft = lastDay - now.getDate();

    if (daysLeft <= 3) {
      const quando = daysLeft === 0 ? "domani"
                   : daysLeft === 1 ? "dopodomani"
                   : `tra ${daysLeft + 1} giorni`;
      note.innerHTML = `<strong>La password cambia ${quando}.</strong> ` +
        "Si rinnova da sola il 1 del mese: da quel giorno serve quella nuova.";
      note.classList.add("show");
    }
  })();

  function unlock() {
    document.getElementById("gate").classList.add("hidden");
    document.getElementById("board").classList.add("show");
    applyMode();
    load();
  }

  async function tryLogin() {
    const btn = document.getElementById("enter");
    const err = document.getElementById("err");
    const val = document.getElementById("pwd").value;
    if (!val) return;

    btn.disabled = true;
    err.textContent = "Verifica...";
    try {
      const h = await hashPassword(val);
      if (h === PWD_HASH) {
        try { sessionStorage.setItem(STORE_KEY, "1"); } catch (e) {}
        unlock();
      } else {
        err.textContent = "Password errata";
        document.getElementById("pwd").value = "";
      }
    } catch (e) {
      err.textContent = "Errore di verifica";
    }
    btn.disabled = false;
  }

  document.getElementById("enter").addEventListener("click", tryLogin);
  document.getElementById("pwd").addEventListener("keydown", e => {
    if (e.key === "Enter") tryLogin();
  });
  // Se gia' autenticato in questa sessione e nello stesso mese, salta il gate
  try { if (sessionStorage.getItem(STORE_KEY) === "1") unlock(); } catch (e) {}

  // ── Modalita' kiosk (TV in palestra) ──────────────────────
  // ?kiosk=TOKEN valido -> nessun login richiesto.
  (async function checkKiosk() {
    const token = urlParams.get("kiosk");
    if (!token) return;
    try {
      const enc  = new TextEncoder();
      const buf  = await crypto.subtle.digest("SHA-256", enc.encode("kiosk:" + token));
      if (bytesToHex(buf) === KIOSK_HASH) {
        document.body.classList.add("kiosk");
        unlock();
      }
    } catch (e) {}
  })();

  // ── Modalita' TV / mobile ─────────────────────────────────
  function isTvMode() {
    return window.matchMedia("(orientation: landscape) and (min-width: 900px)").matches;
  }
  function applyMode() {
    const tv = isTvMode();
    document.body.classList.toggle("tv", tv);
    document.body.classList.toggle("mobile", !tv);
  }
  window.addEventListener("resize", applyMode);
  window.addEventListener("orientationchange", applyMode);

  // ── Orologio ──────────────────────────────────────────────
  function tickClock() {
    const now = new Date();
    const p = n => String(n).padStart(2, "0");
    document.getElementById("clock").textContent =
      `${p(now.getHours())}:${p(now.getMinutes())}:${p(now.getSeconds())}`;
  }
  setInterval(tickClock, 1000); tickClock();

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str || ""; return div.innerHTML;
  }
  function mediaLabel(kind) {
    if (kind === "youtube" || kind === "video") return "Video";
    if (kind === "other") return "PDF";
    return "Media";
  }

  let weekData = null;
  let selected = null;   // indice del giorno selezionato

  // ── Strip settimana ───────────────────────────────────────
  function renderWeek() {
    const strip = document.getElementById("week");
    strip.innerHTML = "";
    weekData.days.forEach((d, i) => {
      const b = document.createElement("div");
      b.className = "daybtn";
      if (d.is_today) b.classList.add("today");
      if (i === selected) b.classList.add("active");
      if (zone === "days" && i === dayFocus) b.classList.add("focused");
      if (!d.empty) b.classList.add("has-content");
      b.innerHTML = `<span class="wd">${d.weekday}</span>
                     <span class="dn">${d.day_number}</span>
                     <span class="dot"></span>`;
      b.addEventListener("click", () => {
        selected = i; dayFocus = i; zone = "days";
        renderWeek(); renderDay();
      });
      strip.appendChild(b);
    });
  }

  // ── Vista settimana intera (per TV) ───────────────────────
  function renderWeekView() {
    document.getElementById("week").style.display = "none";
    document.getElementById("daylabel").textContent =
      `Settimana ${weekData.week_start.split("-").reverse().slice(0,2).join("/")}` +
      ` - ${weekData.week_end.split("-").reverse().slice(0,2).join("/")}`;

    const container = document.getElementById("sections");
    container.className = "weekgrid";
    container.innerHTML = "";

    weekData.days.forEach(d => {
      const col = document.createElement("div");
      col.className = "wcol" + (d.is_today ? " today" : "");

      const head = `<div class="wcol-head">
          <span class="wcol-wd">${d.weekday}</span>
          <span class="wcol-dn">${d.day_number}</span>
        </div>`;

      let body = "";
      if (d.empty) {
        body = `<div class="wcol-rest">REST</div>`;
      } else {
        body = d.sections.map(s => `
          <div class="wsec">
            <div class="wsec-title">${escapeHtml(s.title)}</div>
            <div class="wsec-body">${escapeHtml(s.description)}</div>
          </div>`).join("");
      }

      col.innerHTML = head + `<div class="wcol-body">${body}</div>`;
      container.appendChild(col);
    });
  }

  // ── Giorno selezionato ────────────────────────────────────
  function renderDay() {
    const day = weekData.days[selected];
    document.getElementById("daylabel").textContent = day.date_label;

    const container = document.getElementById("sections");
    container.innerHTML = "";

    if (day.empty || !day.sections.length) {
      container.removeAttribute("data-many");
      const rest = document.createElement("div");
      rest.className = "rest";
      rest.innerHTML = `<div class="rest-mark">REST</div>
                        <div class="rest-label">Giorno di riposo</div>`;
      container.appendChild(rest);
      // Nessun blocco: il cursore resta sulla striscia dei giorni
      zone = "days";
      updateFocus();
      return;
    }

    container.setAttribute("data-many", day.sections.length > 4);

    day.sections.forEach((s, idx) => {
      const el = document.createElement("div");
      el.className = "section";
      // Primo blocco aperto di default su qualsiasi dispositivo
      if (idx === 0) el.classList.add("open");
      const kinds = [...new Set((s.attachments || []).map(a => mediaLabel(a.kind)))];
      const media = kinds.length
        ? `<div class="section-media">` +
          kinds.map(m => `<span class="media-tag">${m}</span>`).join("") + `</div>`
        : "";
      el.innerHTML = `
        <div class="section-head" tabindex="0" role="button">
          <div class="section-title">${escapeHtml(s.title)}</div>
          <div class="chevron"></div>
        </div>
        <div class="section-preview">${escapeHtml(s.description)}</div>
        <div class="section-content">
          <div class="section-body">${escapeHtml(s.description)}</div>
          ${media}
        </div>`;

      el.querySelector(".section-head").addEventListener("click", () => toggleSection(el));
      container.appendChild(el);
    });

    // Cursore del telecomando sul primo blocco
    focusIndex = 0;
    updateFocus();
  }

  // ── Apertura a fisarmonica ────────────────────────────────
  function toggleSection(el) {
    const container = document.getElementById("sections");
    const eraAperto = el.classList.contains("open");
    container.querySelectorAll(".section").forEach(s => s.classList.remove("open"));
    if (!eraAperto) {
      el.classList.add("open");
      requestAnimationFrame(() => {
        el.scrollIntoView({ behavior: "smooth", block: "nearest" });
      });
    }
  }

  // ── Navigazione con telecomando / frecce ──────────────────
  // Due zone: "days" = striscia dei giorni, "sections" = blocchi del giorno.
  let focusIndex = 0;   // blocco selezionato
  let dayFocus   = 0;   // giorno selezionato con il cursore
  let zone       = "sections";

  function allSections() {
    return [...document.querySelectorAll("#sections .section")];
  }

  function updateFocus() {
    const secs = allSections();
    secs.forEach((s, i) => {
      s.classList.toggle("focused", zone === "sections" && i === focusIndex);
    });
    const btns = [...document.querySelectorAll("#week .daybtn")];
    btns.forEach((b, i) => {
      b.classList.toggle("focused", zone === "days" && i === dayFocus);
    });

    const cur = zone === "sections" ? secs[focusIndex] : btns[dayFocus];
    if (cur) cur.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  document.addEventListener("keydown", e => {
    if (!document.getElementById("board").classList.contains("show")) return;
    if (VIEW_WEEK) return;   // la vista settimana non ha blocchi navigabili

    const secs  = allSections();
    const nDays = weekData && weekData.days ? weekData.days.length : 0;

    // ── Zona giorni ──
    if (zone === "days") {
      switch (e.key) {
        case "ArrowRight":
          e.preventDefault();
          dayFocus = (dayFocus + 1) % nDays; updateFocus(); break;
        case "ArrowLeft":
          e.preventDefault();
          dayFocus = (dayFocus - 1 + nDays) % nDays; updateFocus(); break;
        case "ArrowDown":
          e.preventDefault();
          if (secs.length) { zone = "sections"; focusIndex = 0; updateFocus(); }
          break;
        case "Enter":
        case " ":
          e.preventDefault();
          selected = dayFocus;
          renderWeek(); renderDay();
          zone = "days";           // resta sui giorni per continuare a sfogliare
          updateFocus();
          break;
      }
      return;
    }

    // ── Zona blocchi ──
    if (!secs.length) { zone = "days"; updateFocus(); return; }

    switch (e.key) {
      case "ArrowDown":
      case "ArrowRight":
        e.preventDefault();
        focusIndex = Math.min(focusIndex + 1, secs.length - 1);
        updateFocus(); break;
      case "ArrowUp":
      case "ArrowLeft":
        e.preventDefault();
        if (focusIndex === 0) {
          // Dal primo blocco si risale alla striscia dei giorni
          zone = "days"; dayFocus = selected;
        } else {
          focusIndex--;
        }
        updateFocus(); break;
      case "Enter":
      case " ":
        e.preventDefault();
        if (secs[focusIndex]) toggleSection(secs[focusIndex]);
        break;
    }
  });

  function updateFooter() {
    const gen = weekData.generated_at ? new Date(weekData.generated_at) : null;
    if (!gen) return;
    const ageH = (Date.now() - gen.getTime()) / 36e5;
    document.getElementById("updated").textContent = "Aggiornato " +
      gen.toLocaleString("it-IT", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" });
    const status = document.getElementById("status");
    if (ageH > 26) { status.textContent = "Dati non aggiornati"; status.classList.add("stale"); }
    else { status.textContent = "In diretta"; status.classList.remove("stale"); }
  }

  // ── Caricamento ───────────────────────────────────────────
  async function load() {
    try {
      const resp = await fetch(DATA_URL + "?t=" + Date.now());
      if (!resp.ok) throw new Error("fetch failed");
      weekData = await resp.json();

      if (!weekData.days || !weekData.days.length) {
        document.getElementById("daylabel").textContent = "In attesa del primo aggiornamento";
        document.getElementById("week").innerHTML = "";
        document.getElementById("sections").innerHTML = "";
        updateFooter();
        return;
      }

      if (VIEW_WEEK) {
        renderWeekView();
      } else {
        // Seleziona di default il giorno di oggi
        if (selected === null) {
          const idx = weekData.days.findIndex(d => d.is_today);
          selected = idx >= 0 ? idx : 0;
          dayFocus = selected;
        }
        renderWeek();
        renderDay();
      }
      updateFooter();
      applyMode();
    } catch (e) {
      document.getElementById("status").textContent = "Errore caricamento";
      document.getElementById("status").classList.add("stale");
    }
  }

  setInterval(() => { if (weekData) load(); }, REFRESH_MS);

  // Ricarica a mezzanotte per cambiare giorno/settimana
  (function reloadAtMidnight() {
    const now = new Date();
    const midnight = new Date(now);
    midnight.setHours(24, 1, 0, 0);
    setTimeout(() => location.reload(), midnight - now);
  })();
</script>
</body>
</html>
